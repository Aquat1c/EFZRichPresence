name: Temporary SQL transcription model

on:
  push:
    branches:
      - tmp-sql-transcription-model-20260819
  pull_request:
    branches:
      - master
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download multilingual Whisper base q5 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -L --fail --retry 5 --retry-delay 3 --retry-all-errors \
            -o model/ggml-base-q5_1.bin \
            https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-base-q5_1.bin
          test "$(stat -c%s model/ggml-base-q5_1.bin)" -gt 50000000
          sha256sum model/ggml-base-q5_1.bin > model/SHA256SUMS
          ls -lh model

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5-model
          path: model/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
